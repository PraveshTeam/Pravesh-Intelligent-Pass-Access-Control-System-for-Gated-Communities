# =====================================================================
# Pravesh monolith — merged from 10 microservices' application.properties.
# See README.md "Config & environment variables" for the full list of
# env vars you need to set before running this.
# =====================================================================

server.port=8080
spring.application.name=pravesh

spring.datasource.url=jdbc:mysql://localhost:3306/praveshmonolith?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=Pravesh
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------
# JWT — was split between api-gateway (validation) and user-service
# (issuing). Now both live in this one app, so one secret for both.
# ---------------------------------------------------------------------
jwt.secret=${Jwt__Key}
jwt.expiration-ms=86400000
jwt.reset-token-expiration-ms=300000

# ---------------------------------------------------------------------
# Mail (notification-service)
# ---------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# Twilio SMS (notification-service)
# ---------------------------------------------------------------------
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}

pravesh.app-link=${PRAVESH_APP_LINK:http://localhost:5173}

# ---------------------------------------------------------------------
# Razorpay (payment-service)
# ---------------------------------------------------------------------
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# ---------------------------------------------------------------------
# Gemini AI assistant (assistant-service)
# ---------------------------------------------------------------------
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ---------------------------------------------------------------------
# File uploads (user-service onboarding documents)
# ---------------------------------------------------------------------
pravesh.upload.onboarding-dir=${PRAVESH_UPLOAD_DIR:./uploads/onboarding}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------------
# Seed super-admin account (user-service's SuperAdminSeeder)
# ---------------------------------------------------------------------
pravesh.superadmin.email=${SUPERADMIN_EMAIL}
pravesh.superadmin.password=${SUPERADMIN_PASSWORD}


